name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CURFEW_PROTOCOLS_CHECKOUT: ${{ github.workspace }}/curfew-protocols

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [Plain, Gms]
    steps:
      - uses: actions/checkout@v6
        with:
          path: curfew-android
      - uses: actions/checkout@v6
        with:
          repository: TheHypertextStudio/curfew-protocols
          ref: v0.3.0
          path: curfew-protocols
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint, and assemble
        working-directory: curfew-android
        run: >-
          ./gradlew
          test${{ matrix.distribution }}DebugUnitTest
          lint${{ matrix.distribution }}Debug
          assemble${{ matrix.distribution }}Debug
          --stacktrace
      # The release build is the only one R8 minifies, and the app resolves
      # kotlinx.serialization serializers reflectively. Assembling only the debug
      # variant meant a keep-rule regression reached a device before it reached
      # CI. Unsigned here: release signing secrets are injected downstream, and
      # the point of this step is that R8 completes, not that the APK ships.
      - name: Assemble minified release
        working-directory: curfew-android
        run: ./gradlew assemble${{ matrix.distribution }}Release --stacktrace
      - name: Enforce plain dependency isolation
        if: matrix.distribution == 'Plain'
        working-directory: curfew-android
        run: ./gradlew verifyPlainRuntimeIsolation --no-configuration-cache
      - name: Check dependency licenses
        if: matrix.distribution == 'Plain'
        working-directory: curfew-android
        run: ./gradlew :app:checkLicense --no-parallel --no-configuration-cache

  instrumented:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 33
            distribution: Plain
          - api: 34
            distribution: Gms
          - api: 35
            distribution: Plain
          - api: 36
            distribution: Gms
    steps:
      - uses: actions/checkout@v6
        with:
          path: curfew-android
      - uses: actions/checkout@v6
        with:
          repository: TheHypertextStudio/curfew-protocols
          ref: v0.3.0
          path: curfew-protocols
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build application and test APKs
        working-directory: curfew-android
        run: >-
          ./gradlew
          assemble${{ matrix.distribution }}Debug
          assemble${{ matrix.distribution }}DebugAndroidTest
          --max-workers=2
          --no-daemon
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          working-directory: curfew-android
          script: ./ci/run-instrumented-tests.sh ${{ matrix.distribution }} ${{ matrix.api }}

  release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: curfew-android
      - uses: actions/checkout@v6
        with:
          repository: TheHypertextStudio/curfew-protocols
          ref: v0.3.0
          path: curfew-protocols
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Produce local signed evidence
        working-directory: curfew-android
        run: ./gradlew writeReleaseChecksums generateCurfewSbom writeBuildProvenance
      - uses: actions/upload-artifact@v7
        with:
          name: curfew-android-release-evidence
          path: |
            curfew-android/app/build/outputs/**/*.apk
            curfew-android/app/build/outputs/**/*.aab
            curfew-android/app/build/reports/checksums/SHA256SUMS
            curfew-android/app/build/reports/sbom/curfew-android.cdx.json
            curfew-android/app/build/reports/provenance/curfew-android.json
          if-no-files-found: error
