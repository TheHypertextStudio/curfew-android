name: Screenshot catalog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'config/screenshots/**'
      - 'scripts/**'
      - '*gradle*'
      - 'gradle/**'
      - '.github/workflows/screenshot-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/screenshots/**'
      - 'scripts/**'
      - '*gradle*'
      - 'gradle/**'
      - '.github/workflows/screenshot-catalog.yml'

permissions:
  contents: read

concurrency:
  group: screenshot-catalog-${{ github.ref }}
  cancel-in-progress: true

env:
  CURFEW_PROTOCOLS_CHECKOUT: ${{ github.workspace }}/curfew-protocols

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          path: curfew-android
      - uses: actions/checkout@v6
        with:
          repository: TheHypertextStudio/curfew-protocols
          ref: v0.0.13
          path: curfew-protocols
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Check state coverage and catalog behavior
        working-directory: curfew-android
        run: |
          python3 scripts/screenshot_catalog.py --check-coverage
          python3 -m unittest discover -s scripts/tests
      - name: Refresh the complete screenshot matrix
        working-directory: curfew-android
        run: python3 scripts/screenshot_catalog.py
      - name: Check presentation and preview navigation
        working-directory: curfew-android
        run: node scripts/tests/catalog_interactions.cjs
      - name: Package and check the Codex viewer
        working-directory: curfew-android
        run: |
          python3 -m venv "$RUNNER_TEMP/curfew-catalog-python"
          "$RUNNER_TEMP/curfew-catalog-python/bin/pip" install 'Pillow==12.3.0'
          "$RUNNER_TEMP/curfew-catalog-python/bin/python" scripts/build_inline_catalog.py --output artifacts/screenshot-catalog/inline.html
          node scripts/tests/inline_catalog_interactions.cjs artifacts/screenshot-catalog/inline.html artifacts/screenshot-catalog
      - name: Retain the browsable catalog
        uses: actions/upload-artifact@v7
        with:
          name: curfew-android-screenshot-catalog
          path: curfew-android/artifacts/screenshot-catalog/
          retention-days: 30
          if-no-files-found: error
      - name: Retain incomplete-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: curfew-android-screenshot-catalog-diagnostics
          path: curfew-android/app/build/reports/screenshot-catalog/
          retention-days: 14
          if-no-files-found: warn
